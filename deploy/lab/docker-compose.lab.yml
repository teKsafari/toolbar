# Coolify: the lab app (lab/, the capture test target) as a Docker Compose resource, a safe site to
# try the injector on before a real app (docs/injector-on-coolify.md).
#
# In Coolify: + New, this Git repository, Build Pack "Docker Compose", Base Directory /,
# Docker Compose Location /deploy/lab/docker-compose.lab.yml. Set the lab service's domain to
# https://lab-toolbar.example.org:5173 (the :5173 tells Coolify's proxy the container port; the
# public URL has no port). No variables to fill in.
#
# The lab serves a few deliberate failures (a hidden 500, an uncaught error, a request that never
# returns), a WebSocket on /ws and server-sent events on /api/sse; see lab/README.md. Its
# cross-origin image points at localhost:5174 and stays broken here, which is harmless.
services:
  lab:
    build:
      context: lab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_URL_LAB_5173: /
    expose:
      - '5173'
