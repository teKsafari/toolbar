# Coolify: the open-toolbar injector as a Docker Compose resource (apps/injector/README.md,
# D-157, D-201). Step by step: docs/injector-on-coolify.md.
#
# In Coolify: + New, this Git repository, Build Pack "Docker Compose", Base Directory /,
# Docker Compose Location /deploy/injector/docker-compose.injector.yml. Leave its domains empty:
# Traefik reaches it through deploy/injector/traefik-open-toolbar-injector.yml, never through
# labels. Coolify asks for the two required values before the first deploy:
#
#   INJECTOR_SECRET     the same value as the open-toolbar server's INJECTOR_SECRET
#   TOOLBAR_SERVER_URL  the open-toolbar server's address, e.g. https://toolbar.example.org
#
# The injector forwards each reviewer request back into Coolify's proxy (coolify-proxy on the
# coolify network), which routes it to the app as usual, so no app has to be listed here.
services:
  open-toolbar-injector:
    build:
      context: .
      dockerfile: apps/injector/Dockerfile
    restart: unless-stopped
    environment:
      INJECTOR_SECRET: ${INJECTOR_SECRET:?}
      # the server's uploads relay and sign-in page; its public address works from here
      TOOLBAR_SERVER_URL: ${TOOLBAR_SERVER_URL:?}
      # Coolify's proxy, over https: its routers redirect http to https. The certificate it shows
      # for each app is the app's Let's Encrypt one, which verifies against the system roots.
      INJECTOR_LOOPBACK: https://coolify-proxy:443
      # 1 when the proxy has no publicly trusted certificate for your apps (for example behind a
      # Cloudflare tunnel with Traefik's default certificate); the hop stays inside the coolify network
      INJECTOR_LOOPBACK_INSECURE: ${INJECTOR_LOOPBACK_INSECURE:-0}
    expose:
      - '8080'
    networks:
      coolify:
        # Coolify renames the container (open-toolbar-injector-<uuid>); the Traefik file uses this name
        aliases:
          - open-toolbar-injector

networks:
  coolify:
    external: true
