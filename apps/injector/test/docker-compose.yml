# Compose test (D-123): the injector in front of the lab app, sending uploads to an open-toolbar
# server. Run through apps/injector/test/run.sh, which starts it, runs
# e2e/injector/injector.spec.ts in a browser without the extension, and stops it.
#
# The lab (user service toolbar-lab, :5173) and the server (any dev server, SERVER_URL) run on
# the host; the container reaches both through host-gateway.
name: tb-injector-test
services:
  injector:
    build:
      context: ../../..
      dockerfile: apps/injector/Dockerfile
    image: open-toolbar-injector:dev
    ports:
      - '${INJECTOR_PORT:-3506}:8080'
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      INJECTOR_UPSTREAM: ${LAB_UPSTREAM:-http://host.docker.internal:5173}
      # a second app, by host: a page with a strict nonce-based CSP
      INJECTOR_UPSTREAMS: csp.localhost=http://csp-app:80
      TOOLBAR_SERVER_URL: ${INJECTOR_SERVER_URL:-http://host.docker.internal:3306}
      TOOLBAR_PUBLIC_URL: ${SERVER_URL:-http://localhost:3306}
      INJECTOR_SECRET: ${INJECTOR_SECRET:?set INJECTOR_SECRET to the server's value}
      # the browser talks to the injector directly here, with no Traefik in front
      INJECTOR_TRUST_FORWARDED: '0'

  # A page whose Content-Security-Policy allows scripts only by nonce and styles only from 'self':
  # the toolbar must load with the reused nonce and render without inline styles.
  csp-app:
    image: nginx:1.29-alpine
    configs:
      - source: csp-site
        target: /etc/nginx/conf.d/default.conf

configs:
  csp-site:
    content: |
      server {
        listen 80;
        location / {
          default_type text/html;
          add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-c3BlY2lhbA==' 'strict-dynamic'; style-src 'self'; connect-src 'self'" always;
          return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSP app</title><script nonce="c3BlY2lhbA==">window.appRan = true</script></head><body><h1 id="title">Strict CSP</h1><script>window.inlineRan = true</script></body></html>';
        }
      }
