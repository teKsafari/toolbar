# The injector behind a Traefik set up like Coolify's (D-200), for apps/injector/test/coolify-like/run.sh.
#
# - coolify-proxy: traefik:v3.7 with the command line Coolify generates for its proxy
#   (coollabsio/coolify bootstrap/helpers/proxy.php), its Docker provider and file provider, and
#   a self-signed certificate (Coolify's routers would use Let's Encrypt).
# - lab and csp-app: two apps with the labels Coolify writes for a domain
#   (bootstrap/helpers/docker.php, fqdnLabelsForTraefik): an https router with the gzip
#   middleware and an http router that redirects to https.
# - open-toolbar-injector: the injector in loopback mode, reachable only through the dynamic file
#   (run.sh renders deploy/injector/traefik-open-toolbar-injector.yml into ./dynamic/).
# - the open-toolbar server is the worktree's dev server on the host (SERVER_URL), reached
#   through host-gateway.
#
# Browsers use https://lab.localhost:${PROXY_HTTPS_PORT} and https://csp.localhost:${PROXY_HTTPS_PORT}.
name: tb-coolify-like

networks:
  coolify:
    name: tb-coolify-like

services:
  coolify-proxy:
    image: traefik:v3.7
    networks: [coolify]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${PROXY_HTTP_PORT:-3652}:80
      - 127.0.0.1:${PROXY_HTTPS_PORT:-3651}:443
    healthcheck:
      test: wget -qO- http://localhost:80/ping || exit 1
      interval: 4s
      timeout: 2s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/traefik/dynamic:ro
    command:
      - '--ping=true'
      - '--ping.entrypoint=http'
      - '--api.dashboard=true'
      - '--entrypoints.http.address=:80'
      - '--entrypoints.https.address=:443'
      - '--entrypoints.http.http.encodequerysemicolons=true'
      - '--entryPoints.http.http2.maxConcurrentStreams=250'
      - '--entrypoints.https.http.encodequerysemicolons=true'
      - '--entryPoints.https.http2.maxConcurrentStreams=250'
      - '--entrypoints.https.http3'
      - '--providers.file.directory=/traefik/dynamic/'
      - '--providers.file.watch=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http'
      - '--certificatesresolvers.letsencrypt.acme.storage=/tmp/acme.json'
      - '--api.insecure=false'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.constraints=Label(`coolify-like.test`, `1`)'
      # not in Coolify's defaults: the optional step of docs/injector-on-coolify.md that keeps the
      # visitor's address for reviewers' requests (trust X-Forwarded-For from the coolify network)
      - '--entrypoints.https.forwardedHeaders.trustedIPs=${PROXY_TRUSTED_IPS:-127.0.0.1/32}'
      - '--accesslog=true'
      - '--accesslog.fields.headers.names.User-Agent=keep'
    labels:
      - traefik.enable=false
      - coolify.managed=true
      - coolify.proxy=true

  lab:
    build:
      context: ../../../../lab
    image: open-toolbar-lab:dev
    networks: [coolify]
    expose: ['5173']
    labels:
      - coolify-like.test=1
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-labuuid.entryPoints=http
      - traefik.http.routers.http-0-labuuid.middlewares=redirect-to-https
      - traefik.http.routers.http-0-labuuid.rule=Host(`lab.localhost`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-labuuid.service=http-0-labuuid
      - traefik.http.routers.https-0-labuuid.entryPoints=https
      - traefik.http.routers.https-0-labuuid.middlewares=gzip
      - traefik.http.routers.https-0-labuuid.rule=Host(`lab.localhost`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-labuuid.service=https-0-labuuid
      - traefik.http.routers.https-0-labuuid.tls=true
      - traefik.http.services.http-0-labuuid.loadbalancer.server.port=5173
      - traefik.http.services.https-0-labuuid.loadbalancer.server.port=5173

  # A page whose Content-Security-Policy allows scripts only by nonce and styles only from 'self'.
  csp-app:
    image: nginx:1.29-alpine
    networks: [coolify]
    configs:
      - source: csp-site
        target: /etc/nginx/conf.d/default.conf
    labels:
      - coolify-like.test=1
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.http-0-cspuuid.entryPoints=http
      - traefik.http.routers.http-0-cspuuid.middlewares=redirect-to-https
      - traefik.http.routers.http-0-cspuuid.rule=Host(`csp.localhost`) && PathPrefix(`/`)
      - traefik.http.routers.http-0-cspuuid.service=http-0-cspuuid
      - traefik.http.routers.https-0-cspuuid.entryPoints=https
      - traefik.http.routers.https-0-cspuuid.middlewares=gzip
      - traefik.http.routers.https-0-cspuuid.rule=Host(`csp.localhost`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-cspuuid.service=https-0-cspuuid
      - traefik.http.routers.https-0-cspuuid.tls=true
      - traefik.http.services.http-0-cspuuid.loadbalancer.server.port=80
      - traefik.http.services.https-0-cspuuid.loadbalancer.server.port=80

  # Echoes the request it gets: which headers and client address an app sees behind the loop.
  whoami:
    image: traefik/whoami:v1.11
    networks: [coolify]
    labels:
      - coolify-like.test=1
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.routers.https-0-whoamiuuid.entryPoints=https
      - traefik.http.routers.https-0-whoamiuuid.middlewares=gzip
      - traefik.http.routers.https-0-whoamiuuid.rule=Host(`whoami.localhost`) && PathPrefix(`/`)
      - traefik.http.routers.https-0-whoamiuuid.service=https-0-whoamiuuid
      - traefik.http.routers.https-0-whoamiuuid.tls=true
      - traefik.http.services.https-0-whoamiuuid.loadbalancer.server.port=80

  open-toolbar-injector:
    build:
      context: ../../../..
      dockerfile: apps/injector/Dockerfile
    image: open-toolbar-injector:dev
    networks: [coolify]
    extra_hosts:
      - host.docker.internal:host-gateway
    expose: ['8080']
    environment:
      INJECTOR_LOOPBACK: https://coolify-proxy:443
      # the test proxy's certificate is self-signed; Coolify's come from Let's Encrypt
      INJECTOR_LOOPBACK_INSECURE: '1'
      TOOLBAR_SERVER_URL: ${INJECTOR_SERVER_URL:-http://host.docker.internal:3650}
      TOOLBAR_PUBLIC_URL: ${SERVER_URL:-http://localhost:3650}
      INJECTOR_SECRET: ${INJECTOR_SECRET:?set INJECTOR_SECRET to the server's value}

configs:
  csp-site:
    content: |
      server {
        listen 80;
        location / {
          default_type text/html;
          add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-c3BlY2lhbA==' 'strict-dynamic'; style-src 'self'; connect-src 'self'" always;
          return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CSP app</title><script nonce="c3BlY2lhbA==">window.appRan = true</script></head><body><h1 id="title">Strict CSP</h1><script>window.inlineRan = true</script></body></html>';
        }
      }
