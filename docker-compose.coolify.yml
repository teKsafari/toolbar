# open-toolbar on Coolify, quickstart (docs/configuration.md, "Coolify").
#
# In Coolify: + New, pick this Git repository, Build strategy "Compose", Docker Compose Location
# /docker-compose.coolify.yml. Coolify builds the server and Garage images, gives the server a
# domain (SERVICE_URL_SERVER_3000, routed by its proxy to port 3000) and generates every secret
# (SERVICE_PASSWORD_*, SERVICE_HEX_*, SERVICE_USER_*). It asks for four values before the first
# deploy: OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET and ADMIN_EMAILS. Register
# <your domain>/api/auth/callback/oidc as the redirect URI at the provider, deploy, sign in with
# an ADMIN_EMAILS address and set the rest under Settings > Server.
#
# Local transcription: add COMPOSE_PROFILES=whisper under Environment Variables to start the
# whisper service, then pick "Local whisper.cpp" in Settings > Server. To pin a setting by
# environment instead of the admin page, add the variable under Environment Variables
# (docs/configuration.md lists them): Coolify writes them to .env, which the server reads. Example:
# EXTENSION_IDS when you publish the extension in the Chrome Web Store under your own id.
# No service publishes a host port and no Traefik labels are set: Coolify's proxy routes the domain.

services:
  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    # optional overrides: every variable set under Coolify's Environment Variables
    env_file: [{ path: .env, required: false }]
    environment:
      SERVICE_URL_SERVER_3000: /
      PUBLIC_URL: ${SERVICE_URL_SERVER_3000}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?}
      # wiring of this stack
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/toolbar
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: toolbar
      S3_ACCESS_KEY_ID: GK000000000000000000000000
      S3_SECRET_ACCESS_KEY: ${SERVICE_HEX_64_S3SECRET}
      WHISPER_URL: http://whisper:8080
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: toolbar
    volumes: [pg:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d toolbar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  garage:
    # the image bakes in deploy/garage.toml, so no file has to be bind-mounted from the repository
    build: { context: ./deploy, dockerfile: garage.Dockerfile }
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: ${SERVICE_HEX_64_GARAGERPC}
      GARAGE_ADMIN_TOKEN: ${SERVICE_PASSWORD_64_GARAGEADMIN}
      GARAGE_DEFAULT_ACCESS_KEY: GK000000000000000000000000
      GARAGE_DEFAULT_SECRET_KEY: ${SERVICE_HEX_64_S3SECRET}
      GARAGE_DEFAULT_BUCKET: toolbar
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "toolbar"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Local transcription, off unless COMPOSE_PROFILES=whisper (whisper.cpp, CPU, no key). The first
  # start downloads the base model, which takes minutes.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main@sha256:9f6bf30782c0c4f431571a7e3da572a84769aec6381580df0249e252dfc0aa18
    profiles: [whisper]
    entrypoint: ["bash", "-c"]
    command:
      - >-
        [ -f /models/ggml-base.bin ] || /app/models/download-ggml-model.sh base /models;
        exec whisper-server --host 0.0.0.0 --port 8080 --convert -m /models/ggml-base.bin
    volumes: [whisper-models:/models]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

volumes:
  pg: {}
  garage-meta: {}
  garage-data: {}
  whisper-models: {}
