# lab/ stays its own pnpm project (its own lockfile and workspace file), so the
# running toolbar-lab service never depends on this workspace's installs.
packages:
  - apps/*
  - packages/*
  - e2e
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": false
  spawn-sync: false
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1151.0'
  - '@aws-sdk/s3-request-presigner@3.1151.0'
patchedDependencies:
  '@sveltejs/kit@3.0.1': patches/@sveltejs__kit@3.0.1.patch
